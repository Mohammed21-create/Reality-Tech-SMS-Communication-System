<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Change password · Reality Tech</title>
<meta name="theme-color" content="#0f2148">
<meta name="description" content="Reality Tech School Communication System">
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/assets/icons/icon-192.png">
<link rel="apple-touch-icon" href="/assets/icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="RT Schools">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="stylesheet" href="/css/app.css">
</head>
<body>
<div class="auth-wrap">
  <form class="auth-card" id="pw-form" novalidate>
    <img class="logo" src="/assets/icons/icon-192.png" alt="Reality Tech logo">
    <h1>Change password</h1>
    <p class="muted" id="forced">You must choose a new password before continuing.</p>
    <div class="field"><label for="current">Current (temporary) password</label><input id="current" type="password" autocomplete="current-password" required></div>
    <div class="field"><label for="new">New password</label><input id="new" type="password" autocomplete="new-password" required><div class="hint">At least 10 characters, with letters and numbers.</div></div>
    <div class="field"><label for="confirm">Confirm new password</label><input id="confirm" type="password" autocomplete="new-password" required></div>
    <button class="btn w-full" id="pw-btn" type="submit">Save new password</button>
  </form>
</div>
<script type="module" src="/js/pages/changePassword.js"></script>
</body>
</html>
